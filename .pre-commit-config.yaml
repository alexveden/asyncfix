repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.6
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format

- repo: local
  hooks:
    - id: pytest-check
      name: pytest-check
      stages: [push]
      types: [python]
      entry: pytest
      language: system
      pass_filenames: false
      always_run: true
    - id: mypy
      name: mypy
      stages: [push]
      types: [python]
      entry: mypy .
      language: system
      pass_filenames: false
      always_run: true
