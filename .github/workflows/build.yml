# This workflow runs tests on every supported Python version, then lints,
# type checks, builds the docs, updates the coverage badge, and deploys the
# docs to GitHub Pages.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: pytest + ruff + mypy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/

  lint-and-coverage:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type check with mypy
      run: |
        mypy .

    - name: Build docs
      run: |
        ruff check ./asyncfix/ --select D
        lazydocs --output-path="./docs/reference" --overview-file="README.md" --src-base-url="https://github.com/alexveden/asyncfix/blob/main/" asyncfix
        mkdocs build --strict

    - name: Run coverage
      run: |
          coverage run -m pytest tests/
          coverage report -m
    
    - name: coverage.py badge
      uses: tj-actions/coverage-badge-py@v2.0.3
      with:
        output: .github/coverage.svg

    - name: Verify Changed files
      uses: tj-actions/verify-changed-files@v16
      id: verify-changed-files
      with:
        files: .github/coverage.svg

    - name: Commit files
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .github/coverage.svg
        git commit -m "Updated coverage.svg"
    - name: Push changes
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.github_token }}
        branch: ${{ github.ref }}

  docs:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ test, lint-and-coverage ]

    runs-on: ubuntu-latest

    concurrency:
      group: docs-deploy
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Generate API reference
      run: |
        ruff check ./asyncfix/ --select D
        lazydocs --output-path="./docs/reference" --overview-file="README.md" --src-base-url="https://github.com/alexveden/asyncfix/blob/main/" asyncfix
    - name: Build docs
      run: |
        mkdocs build --strict
    - name: Deploy docs
      run: |
        mkdocs gh-deploy --force
