[project]
name = "asyncfix"
version = "1.0.1"
description = "AsyncIO FIX Protocol client for Python"
readme = "README.md"
authors = [{ name = "Alex Veden", email = "i@alexveden.com" }]
license = {text = "MIT License"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Development Status :: 5 - Production/Stable",
]
keywords = ["asyncio", "FIX", "protocol", "client", "server", "parser", "unit tests", "simplefix", "tester", "orders"]
requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.17.6",
  "pytest",
  "pre-commit",
  'pytest-asyncio',
  'lazydocs',
  'toml',
  "mkdocs",
]

[project.urls]
Homepage = "https://github.com/alexveden/asyncfix"

[tool.setuptools]
packages = ["asyncfix", "asyncfix.protocol"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
extend-select = ["D", "E501"]
ignore = ["UP042", "D403"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403", "I001"]
"tests/**" = [
  "D", "E501", "F401", "F403", "F405", "F541",
  "F841", "E741", "W291", "E265", "W293",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.distutils.bdist_wheel]
universal = true

