[project]
name = "asyncfix"
version = "1.1.0"
description = "AsyncIO FIX Protocol client for Python"
readme = "README.md"
authors = [{ name = "Alex Veden", email = "i@alexveden.com" }]
license = {text = "MIT License"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
]
keywords = ["asyncio", "FIX", "protocol", "client", "server", "parser", "unit tests", "simplefix", "tester", "orders"]
requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.17.6",
  "mypy==2.4.1",
  "pytest",
  "pytest-asyncio",
  "coverage",
  "build",
  "twine",
  "pre-commit",
  "lazydocs",
  "toml",
  "mkdocs",
]

[project.urls]
Homepage = "https://github.com/alexveden/asyncfix"

[tool.setuptools]
packages = ["asyncfix", "asyncfix.protocol"]

[tool.setuptools.package-data]
asyncfix = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
extend-select = ["D", "E501"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "I001"]
"tests/**" = ["D", "E501", "F401", "F841"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
files = ["asyncfix"]
exclude = ["^tests/", "^build/"]
strict = true

[tool.distutils.bdist_wheel]
universal = true

